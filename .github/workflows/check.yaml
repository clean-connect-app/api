name: Проверка API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clean_connect
          POSTGRES_PASSWORD: clean_connect
          POSTGRES_DB: clean_connect
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U clean_connect"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://clean_connect:clean_connect@127.0.0.1:55432/clean_connect
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
